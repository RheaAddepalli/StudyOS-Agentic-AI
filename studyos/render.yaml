services:
  - type: web
    name: studyos-api
    runtime: python
    plan: free
    buildCommand: "pip install -e . -r requirements.txt"
    startCommand: "uvicorn studyos.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in the Render dashboard, don't commit it
      - key: STUDYOS_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_URL
        sync: false          # your Neon connection string, set manually
      - key: ALLOWED_ORIGINS
        sync: false          # your deployed frontend's URL, set manually
      - key: GITHUB_TOKEN
        sync: false          # optional
